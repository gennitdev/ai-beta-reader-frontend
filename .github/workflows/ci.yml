name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Electron dependencies
        run: npm ci --prefix electron --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Type check Electron
        run: npm run type-check:electron

      - name: Build
        run: npm run build-only

      - name: Run unit tests
        run: npm run test:coverage

      - name: Run deterministic bundle fuzz tests
        env:
          BUNDLE_FUZZ_SEED: 132202608
          BUNDLE_FUZZ_RUNS: 1000
        run: npm run test:fuzz

      - name: Retain bundle fuzz counterexamples
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-fuzz-counterexamples
          path: test-results/fuzz/
          if-no-files-found: ignore
          retention-days: 30

      - name: Run Electron runtime tests
        run: npm run test:electron

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # Informational for now: the production tree currently carries advisories
      # via @capacitor/cli's transitive `tar` dependency that have no clean fix.
      # Kept non-blocking so it surfaces *new* regressions without failing CI.
      # Tighten to a blocking `--audit-level=high` once those are resolved.
      - name: Security audit (production dependencies)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # End-to-end tests run as a separate job so a flaky browser run never blocks
  # the fast lint/type-check/unit signal from `quality`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `--ignore-scripts` skips the postinstall that copies the sql.js WASM
      # asset into public/. The browser fetches it from the dev server at
      # runtime, so the E2E suite needs it present.
      - name: Copy sql.js WASM asset
        run: npm run copy:wasm

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type-check E2E sources
        run: npm run type-check:e2e

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
